[pytest]
# Only the offline, non-interactive test files run in CI and in Docker.
# test_io_manager.py, test_ai_manager.py and test_script.py are interactive / outdated scripts
# (they call input(), the live API, or the old function-style API). When a teammate rewrites one
# as a proper offline test, delete its --ignore line below so it runs automatically.
addopts = -v --ignore=test_ai_manager.py 