name: CI

# Runs the automated tests every time code is pushed to main or a pull request targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests (offline, no API key needed)
        run: python -m pytest

  docker:
    name: Tests (Docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fnb-triage .

      - name: Run automated tests inside the container (offline, no API key needed)
        run: docker run --rm fnb-triage python -m pytest